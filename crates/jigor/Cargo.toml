[package]
name = "jigor"
description = "System One decision gateway — local von/laya ONNX backends (ort) plus the remote jev API (OpenRouter Decisions)"
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# use relative path because maturin does not recognize inherited readmes
readme = "../../README.md"

[lib]
name = "jigor"
path = "src/lib.rs"

[dependencies]
ort.workspace = true
tokenizers.workspace = true
ndarray.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
ureq.workspace = true

# On the only target ort-sys lacks ONNX Runtime prebuilts for
# (Intel Macs), disable ort-sys's own build-script linking/downloading —
# build.rs takes over: it builds ONNX Runtime from source (or honors
# ORT_LIB_PATH) and emits the link directives itself. Feature
# unification scopes this to x86_64-apple-darwin builds only; every
# other target keeps ort's normal prebuilt flow.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort-sys = { workspace = true, features = ["disable-linking"] }

[features]
# default keeps the CUDA provider (dev/test/CLI builds); the wheel build
# compiles with default-features=false for a CPU-only manylinux wheel
default = ["cuda"]
cuda = ["ort/cuda"]

[dev-dependencies]
approx = "0.5"
# runtime for the `#[tokio::test]` harness in the lib tests
tokio.workspace = true