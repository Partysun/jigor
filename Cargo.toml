# jigor — workspace root (virtual manifest, ast-grep style).
#
# Two crates:
#   crates/jigor     — the `jigor` library (decision backends + wire protocol)
#   crates/jigor-cli — the `jigor` CLI/server binary
#
# Shared metadata and dependency versions live here; members inherit them
# with `X.workspace = true`.

[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.8"
authors = ["Iurii Zatsepin (https://zatsepin.dev)"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Partysun/jigor"

[workspace.dependencies]
jigor = { path = "crates/jigor", version = "0.1.7", default-features = false }
jigor-cli = { path = "crates/jigor-cli", version = "0.1.7" }
# ort defaults to tls-native (OpenSSL); keep every other default but use
# its rustls TLS so no build needs the openssl native stack. CUDA is
# currently off in the release build (see JIGOR_DEVICE; re-add "cuda" to
# the features when a manylinux-compatible GPU dist is available).
#
# api-24 (not ort's default api-27): macOS binaries statically link the
# source-built ONNX Runtime pinned at v1.24.2 (scripts/build-onnxruntime-
# macos.sh — Microsoft ships no Intel mac prebuilts past 1.24), whose
# runtime only serves API 1..24. Requesting 27 panics at ORT init on
# every mac build. The linux/windows prebuilts (ORT 1.28) accept 24 too.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["tls-rustls", "std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "api-24"] }
# ort-sys FFI crate: only to flip `disable-linking` for x86_64-apple-darwin
# (see crates/jigor/build.rs — it takes over ONNX Runtime linking there
# because ort-sys has no Intel mac prebuilts).
ort-sys = "2.0.0-rc.12"
tokenizers = "0.23.1"
ndarray = "0.17"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.52.4", features = ["rt-multi-thread", "macros", "net"] }
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server", "http1", "tokio"] }
http-body-util = "0.1.4"
http = "1.4.2"
bytes = "1.12.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

# Optimize for size, like klava's release profile (inherited by all members)
[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Better optimization
strip = true      # Strip symbols for smaller binary
panic = "abort"   # Smaller binary