# npm distribution — linux builds + the meta `jigor` package publish.
# Each platform package publishes from its own per-platform pipeline file
# (`.woodpecker/npm-*.yml`): Woodpecker runs a pipeline on one agent kind,
# selected by pipeline-level labels, so a multi-agent matrix = one file per
# platform. The meta package publishes from here after the linux packages;
# the platform packages for the other OSes publish in parallel from their
# own tag-triggered pipelines (npm does not verify the platform package
# versions at meta-publish time).
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "npm", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: build-x64
    image: rust:latest
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - apt-get update && apt-get install -y nodejs npm
      - cargo build -p jigor-cli --release
      - cp target/release/jigor npm/platforms/linux-x64-gnu/
      - ./npm/platforms/linux-x64-gnu/jigor models
      - node scripts/npm-version.js npm/platforms/linux-x64-gnu
      - echo "//registry.npmjs.org/:_authToken=$${NPM_TOKEN}" >> ~/.npmrc
      - node scripts/npm-publish.js npm/platforms/linux-x64-gnu

  - name: build-arm64
    image: rust:latest
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/build-npm-linux-arm64.sh

  - name: publish-meta
    image: node:22
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    depends_on:
      - build-x64
      - build-arm64
    commands:
      - node scripts/npm-version.js npm
      - echo "//registry.npmjs.org/:_authToken=$${NPM_TOKEN}" >> ~/.npmrc
      - node scripts/npm-publish.js npm