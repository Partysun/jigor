when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "windows", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: windows/amd64

steps:
  # Native powershell step on the local Windows agent: Step environments DO reach powershell steps, but not
  # the bash (WSL) steps, so the whole publish runs in powershell.
  - name: windows-publish
    image: powershell
    environment:
      UV_PUBLISH_TOKEN:
        from_secret: uv_token
    commands:
      # guard against an agent rustup with no default toolchain configured
      # (PS 5.1 has no `||`: let rustup fail the step if it cannot set a default)
      - rustup default stable
      - cargo install --quiet uv
      - uv tool install --quiet maturin
      - uv tool run maturin build --release --out dist
      - uv publish dist/*