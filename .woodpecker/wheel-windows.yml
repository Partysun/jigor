when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "windows", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: windows/amd64

steps:
  # Native powershell step on the local Windows agent: Step environments DO reach powershell steps, but not
  # the bash (WSL) steps, so the whole publish runs in powershell (same as npm-win32.yml).
  - name: publish-windows
    image: powershell
    environment:
      UV_PUBLISH_TOKEN:
        from_secret: uv_token
    commands:
      # plain `powershell` blocks .ps1 scripts (execution policy); run a
      # nested shell with a bypass
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-wheel-win32.ps1