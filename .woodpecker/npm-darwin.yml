# npm distribution — macOS universal2 binary package (`jigor-darwin`).
# Built on the single darwin/amd64 agent: the universal2 fat binary runs
# on both Intel and Apple Silicon Macs. The darwin/amd64 agent
# source-compiles ONNX Runtime for both architectures (no prebuilt
# x86_64-macOS ort-sys runtime), see scripts/build-npm-darwin.sh.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "npm", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: darwin/amd64

steps:
  - name: npm-darwin
    image: bash
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/build-npm-darwin.sh