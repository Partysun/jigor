# npm distribution — Apple Silicon binary package (`jigor-darwin-arm64`).
# Native powershell/bash-free bash script on the darwin/arm64 local agent;
# the whole build+publish lives in a script file so Woodpecker's envsubst
# never touches a `$`.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "npm", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: darwin/arm64

steps:
  - name: npm-darwin-arm64
    image: bash
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/build-npm-darwin-arm64.sh