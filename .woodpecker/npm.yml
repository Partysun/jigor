# npm distribution of the `jigor` CLI/server binary.
#
# Binary-only npm packages (no node bindings, no napi): each platform builds
# natively on its own agent and publishes its platform package directly
# (binaries are never committed — only the package.json templates are). The
# meta `jigor` package is published last; its optionalDependencies pull the
# matching platform package at install time.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "npm", "publish"]'
  - event: tag
    ref: refs/tags/v*

steps:
  - name: npm-linux-x64
    image: rust:latest
    labels:
      backend: docker
      platform: linux/amd64
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - apt-get update && apt-get install -y nodejs npm
      - cargo build -p jigor-cli --release
      - cp target/release/jigor npm/platforms/linux-x64-gnu/
      - ./npm/platforms/linux-x64-gnu/jigor models
      - node scripts/npm-version.js npm/platforms/linux-x64-gnu
      - cd npm/platforms/linux-x64-gnu && npm publish --access public

  - name: npm-linux-arm64
    image: rust:latest
    labels:
      backend: docker
      platform: linux/amd64
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - apt-get update && apt-get install -y nodejs npm gcc-aarch64-linux-gnu
      - rustup target add aarch64-unknown-linux-gnu
      - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
      - cargo build -p jigor-cli --release --target aarch64-unknown-linux-gnu
      - cp target/release/jigor npm/platforms/linux-arm64-gnu/
      - node scripts/npm-version.js npm/platforms/linux-arm64-gnu
      - cd npm/platforms/linux-arm64-gnu && npm publish --access public

  # Native powershell step on the local Windows agent: Step environments DO
  # reach powershell steps, but not the bash (WSL) steps, so the whole
  # publish runs in powershell (same as release-windows.yml).
  - name: npm-win32-x64
    image: powershell
    labels:
      platform: windows/amd64
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - cargo build -p jigor-cli --release
      - cp target/release/jigor.exe npm/platforms/win32-x64-msvc/
      - .\npm\platforms\win32-x64-msvc\jigor.exe models
      - node scripts/npm-version.js npm/platforms/win32-x64-msvc
      - cd npm\platforms\win32-x64-msvc; npm publish --access public; exit $LASTEXITCODE

  - name: npm-darwin-x64
    image: bash
    labels:
      platform: darwin/amd64
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/build-npm-darwin-x64.sh

  - name: npm-darwin-arm64
    image: bash
    labels:
      platform: darwin/arm64
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/build-npm-darwin-arm64.sh

  - name: npm-publish-meta
    image: node:22
    labels:
      backend: docker
      platform: linux/amd64
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    depends_on:
      - npm-linux-x64
      - npm-linux-arm64
      - npm-darwin-arm64
      - npm-win32-x64
      - npm-darwin-x64
    commands:
      - node scripts/npm-version.js npm
      - cd npm && npm publish --access public