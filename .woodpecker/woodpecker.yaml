when:
  - event: [push, pull_request]
    branch: master
  - event: manual

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: test
    image: rust:latest
    commands:
      - cargo test

  - name: build
    image: rust:latest
    commands:
      - cargo install --quiet uv || true
      - uv tool install --quiet maturin || true
      # ort's prebuilt dists are gcc-13/Ubuntu-24.04-bound (GLIBC_2.38),
      # so no manylinux_2_28 wheel is possible; build natively to prove the
      # wheel compiles and ship the sdist. Wheels come from the macos
      # (universal2) and windows release pipelines.
      - uv tool run maturin build --release --manylinux linux --sdist --out dist
    depends_on:
      - test