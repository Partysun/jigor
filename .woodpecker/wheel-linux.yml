when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "linux", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: publish-linux
    image: rust:latest
    commands:
      # rust:latest image has no pip; uv comes via cargo
      - cargo install --quiet uv || true
      - uv tool install --quiet maturin || true
      - uv tool run maturin build --release --manylinux linux --sdist --out dist
      # linux wheels can't be manylinux-tagged (ort prebuilt needs GLIBC_2.38);
      # publish the sdist only, wheels ship from the macos/windows pipelines
      - rm -f dist/*linux_x86_64*.whl
      - uv publish dist/*
    environment:
      UV_PUBLISH_TOKEN:
        from_secret: uv_token