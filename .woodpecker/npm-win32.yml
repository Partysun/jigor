# npm distribution — Windows binary package (`jigor-win32-x64-msvc`).
# Native powershell step on the local Windows agent: Step environments DO
# reach powershell steps, but not the bash (WSL) steps, so the whole
# publish runs in powershell (same as release-windows.yml). All logic
# lives in a script file so Woodpecker's envsubst never touches a dollar sign.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "npm", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: windows/amd64

steps:
  - name: publish-x64
    image: powershell
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      # plain `powershell` blocks .ps1 scripts (execution policy); run a
      # nested shell with a bypass
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-npm-win32.ps1